<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oman eVisa Status</title>

<!-- Google Font (very close match to original clean UI font) -->
<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body{
    background:#f2f2f2;
}

/* ================= HEADER ================= */

.header{
    background:#ffffff;
    padding:20px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-left{
    display:flex;
    align-items:center;
    gap:40px;
}

.header img{
    height:60px;
}

.menu-icon{
    width:50px;
    height:50px;
    background:#4c63b6;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

.menu-icon div{
    width:25px;
    height:3px;
    background:white;
    margin:3px 0;
}

/* ================= LANGUAGE BAR ================= */

.language-bar{
    display:flex;
    height:60px;
}

.language-left{
    width:220px;
    background:#dcdcdc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:600;
    color:#3c4aa3;
}

.language-right{
    flex:1;
    background:linear-gradient(90deg,#4c63b6,#566fd0);
}

/* ================= CARD ================= */

.container{
    padding:40px 20px;
    display:flex;
    justify-content:center;
}

.card{
    background:white;
    width:600px;
    border-radius:12px;
    padding:40px 30px;
    box-shadow:0 0 0 1px #e2e2e2;
    text-align:center;
}

/* ================= GREEN ACTIVE SIGN ================= */

.status-circle{
    width:140px;
    height:140px;
    background:#38c172;
    border-radius:50%;
    margin:0 auto 25px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow: inset 0 0 0 6px #2da563;
}

.checkmark{
    width:50px;
    height:90px;
    border-right:8px solid white;
    border-bottom:8px solid white;
    transform:rotate(45deg);
    margin-top:-10px;
}

.status-title{
    font-size:32px;
    font-weight:700;
    margin-bottom:25px;
}

.divider{
    height:1px;
    background:#dcdcdc;
    margin:20px 0 30px;
}

/* ================= INFO LIST ================= */

.info{
    text-align:center;
}

.info-item{
    margin-bottom:25px;
}

.label{
    font-size:20px;
    color:#444;
}

.value{
    font-size:24px;
    font-weight:700;
    margin-top:5px;
}

/* ================= FOOTER ================= */

.footer-pattern{
    height:45px;
    background:url('footer-pattern.png');
    background-size:cover;
}

.footer{
    background:linear-gradient(90deg,#4c63b6,#566fd0);
    height:90px;
    display:flex;
    align-items:center;
    padding-left:40px;
}

.footer .menu-icon{
    background:transparent;
    border:2px solid rgba(255,255,255,0.5);
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="header">
    <div class="header-left">
        <img src="01.png" width="842" height="600">
    </div>

    <div class="menu-icon">
        <div></div>
        <div></div>
        <div></div>
    </div>
</div>

<!-- ================= LANGUAGE BAR ================= -->
<div class="language-bar">
    <div class="language-left">العربية</div>
    <div class="language-right"></div>
</div>

<!-- ================= MAIN CARD ================= -->
<div class="container">
    <div class="card">

        <div class="status-circle">
            <div class="checkmark"></div>
        </div>

        <div class="status-title">Visa is Active</div>

        <div class="divider"></div>

        <div class="info">

            <div class="info-item">
                <div class="label">Visa Number</div>
                <div class="value">78194512</div>
            </div>

            <div class="info-item">
                <div class="label">Given Name</div>
                <div class="value">BEKAR EDAO</div>
            </div>

            <div class="info-item">
                <div class="label">Family Name</div>
                <div class="value">SADO</div>
            </div>

            <div class="info-item">
                <div class="label">Gender</div>
                <div class="value">Male</div>
            </div>

            <div class="info-item">
                <div class="label">Nationality</div>
                <div class="value">ETHIOPIA</div>
            </div>

            <div class="info-item">
                <div class="label">Travel Document Number</div>
                <div class="value">EQ1976138</div>
            </div>

            <div class="info-item">
                <div class="label">Travel Document Expiry Date</div>
                <div class="value">21-05-2030</div>
            </div>

            <div class="info-item">
                <div class="label">Occupation</div>
                <div class="value">General Animal Breeder</div>
            </div>

        </div>

    </div>
</div>

<div class="footer-pattern"></div>

<div class="footer">
    <div class="menu-icon">
        <div></div>
        <div></div>
        <div></div>
    </div>
</div>

</body>
</html>
